name: Deploy

# Push to main → tests → OpenNext build → deploy to Cloudflare Workers.
# Deploy runs ONLY when tests + build are green, and pushes QUEUE (an in-flight
# deploy is never cancelled by a newer push — each green commit lands in order).
# The build runs on Linux (OpenNext is not reliable on Windows), which also
# fixes the local .open-next file-lock problem.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test → build (OpenNext) → deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm run test --workspace web

      - name: Build (OpenNext)
        working-directory: apps/web
        env:
          # Build-time: NEXT_PUBLIC_* are inlined into the bundle by `next build`.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      # A green build is NOT a working site. On 2026-07-14 a deploy passed tests, passed
      # the OpenNext build, deployed — and then every page 500'd with a ChunkLoadError that
      # only appears at runtime in the Worker. Nobody knew until the owner tried to log in.
      # So: after every deploy, actually load the site. A page that does not render is a
      # failed deploy, and this job says so loudly instead of leaving the shop dark.
      - name: Smoke test — the deployed site actually renders
        run: |
          set -e
          url="https://app-carfectionist.com/login"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 30 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ $url renders (HTTP 200) on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code — waiting for the new version to roll out…"
            sleep 10
          done
          echo "::error::DEPLOY IS BROKEN — $url returned HTTP $code after the deploy. The site is down; roll back (git revert) before anything else."
          head -c 800 /tmp/body.html || true
          exit 1

# Runtime Worker secrets (SUPABASE_SERVICE_ROLE_KEY, WHATSAPP_*) are NOT set
# here — set once on the Worker (dashboard → Settings → Variables and Secrets);
# they persist across deploys. PDF rendering needs no secret at all (the
# `browser` binding in wrangler.jsonc is the auth).
