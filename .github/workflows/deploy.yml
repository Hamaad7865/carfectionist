name: Deploy

# Push to main → tests → OpenNext build → deploy to Cloudflare Workers.
# Deploy runs ONLY when tests + build are green, and pushes QUEUE (an in-flight
# deploy is never cancelled by a newer push — each green commit lands in order).
# The build runs on Linux (OpenNext is not reliable on Windows), which also
# fixes the local .open-next file-lock problem.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test → build (OpenNext) → deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm run test --workspace web

      # WEBPACK, not Turbopack (Next 16's default). Turbopack names its server chunks
      # `[root-of-the-server]__<hash>._.js`; the OpenNext Worker cannot resolve those at
      # runtime, so pages die with ChunkLoadError — intermittently, per isolate, with a
      # green build. See apps/web/next.config.ts.
      - name: Build (Next, webpack)
        working-directory: apps/web
        env:
          # Build-time: NEXT_PUBLIC_* are inlined into the bundle by `next build`.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx next build --webpack

      # Bundle the webpack build into the Worker. --skipNextBuild so OpenNext does NOT re-run
      # `next build` itself (which would use Turbopack again and undo the whole point).
      - name: Bundle the Worker (OpenNext)
        working-directory: apps/web
        run: npx opennextjs-cloudflare build --skipNextBuild

      # `deploy` ships the bundle built above — it takes no build flags (unknown args are
      # forwarded to wrangler and it errors out).
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      # A green build is NOT a working site. On 2026-07-14 a deploy passed tests, passed the
      # OpenNext build, deployed green — and pages 500'd with a runtime ChunkLoadError that
      # only appears inside the Worker. Worse, it was INTERMITTENT: the same URL answered 200
      # on one request and 500 on the next, so a single check of a single page can miss it.
      # So: hit several real pages, several times each. Anything that 500s fails the deploy.
      - name: Smoke test — the deployed site actually renders
        run: |
          sleep 15   # let the new version roll out across isolates
          base="https://app-carfectionist.com"
          paths="/login /jobs /products /sales /dashboard /sales/counter"
          fail=0
          for round in 1 2 3; do
            for p in $paths; do
              code=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 30 "$base$p" || echo "000")
              # A signed-out visitor gets 200 (login) or a redirect to it. A 5xx is a broken build.
              case "$code" in
                200|301|302|307|308) echo "  ✓ $p -> $code (round $round)" ;;
                *) echo "  ✗ $p -> $code (round $round)"; fail=1; head -c 400 /tmp/body.html || true ;;
              esac
            done
          done
          if [ "$fail" = "1" ]; then
            echo "::error::DEPLOY IS BROKEN — the site is serving errors. Roll back (git revert) before anything else."
            exit 1
          fi
          echo "✓ every page renders on the deployed site"

# Runtime Worker secrets (SUPABASE_SERVICE_ROLE_KEY, WHATSAPP_*) are NOT set
# here — set once on the Worker (dashboard → Settings → Variables and Secrets);
# they persist across deploys. PDF rendering needs no secret at all (the
# `browser` binding in wrangler.jsonc is the auth).
